[project]
name = "on-set-war-room"
version = "0.1.0"
description = "On-Set War Room — production incident command center backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "clickhouse-connect>=0.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "google-adk>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/scenarios/*.json"]
