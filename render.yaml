# Exported by Render Blueprint.
# Docs: https://render.com/docs/blueprint-spec

services:
  # Recommended: Python native runtime (fastest free-tier deploy).
  - type: web
    name: on-set-war-room-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # If you choose Docker in the Render dashboard instead, use rootDir: backend
    # so Render picks up backend/Dockerfile (not the repo-root multi-stage Dockerfile).
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        sync: false
      - key: CLICKHOUSE_HOST
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_USERNAME
        value: default
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_DATABASE
        value: on_set_war_room
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
